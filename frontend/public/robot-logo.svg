<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <circle cx="50" cy="50" r="48" fill="url(#grad)" />
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <!-- Robot Antenna -->
  <line x1="50" y1="20" x2="50" y2="10" stroke="#FFF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="5" fill="#FBBF24"/>
  <!-- Robot Head -->
  <rect x="25" y="20" width="50" height="40" rx="12" fill="#FFFFFF"/>
  <rect x="30" y="26" width="40" height="26" rx="8" fill="#0F172A"/>
  <!-- Eyes -->
  <circle cx="40" cy="39" r="5" fill="#38BDF8"/>
  <circle cx="42" cy="37" r="1.5" fill="#FFFFFF"/>
  <circle cx="60" cy="39" r="5" fill="#38BDF8"/>
  <circle cx="62" cy="37" r="1.5" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M44 48 Q50 53 56 48" stroke="#34D399" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Cheeks -->
  <circle cx="34" cy="44" r="2.5" fill="#FB7185" opacity="0.8"/>
  <circle cx="66" cy="44" r="2.5" fill="#FB7185" opacity="0.8"/>
  <!-- Neck & Body -->
  <rect x="42" y="60" width="16" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="28" y="66" width="44" height="26" rx="10" fill="#FFFFFF"/>
  <circle cx="50" cy="78" r="6" fill="#F43F5E"/>
</svg>

